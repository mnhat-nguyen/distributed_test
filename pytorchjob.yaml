# =============================================================================
# k8s/pytorchjob.yaml  —  4 nodes x 1 GPU, Ring AllReduce
#
# Requires: Kubeflow Training Operator
#   kubectl apply -k "github.com/kubeflow/training-operator/manifests/overlays/standalone"
#
# Deploy:   kubectl apply -f k8s/pytorchjob.yaml
# Monitor:  kubectl logs -n kubeflow -l job-name=resnet-ring-ddp -c pytorch -f
# Delete:   kubectl delete -f k8s/pytorchjob.yaml
# =============================================================================

apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: resnet-ring-ddp
  namespace: kubeflow
spec:
  pytorchReplicaSpecs:

    # ── Master (rank 0) ───────────────────────────────────────────────────────
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: my-registry/resnet-ring-ddp:latest   # ← replace with your image
              imagePullPolicy: IfNotPresent
              command:
                - torchrun
                - "--nnodes=4"
                - "--nproc_per_node=1"
                - "--rdzv_backend=c10d"
                - "--rdzv_endpoint=$(MASTER_ADDR):$(MASTER_PORT)"
                - "train.py"
                - "--arch=resnet50"
                - "--epochs=90"
                - "--batch_size=64"
                - "--lr=0.1"
                - "--data_dir=/data"
                - "--output_dir=/checkpoints"
              env:
                - name: MASTER_PORT
                  value: "20011"
                # ── Ring AllReduce settings ──────────────────────────────────
                - name: NCCL_ALGO
                  value: "Ring"         # force Ring AllReduce
                - name: NCCL_PROTO
                  value: "Simple"       # best protocol for large gradients
                - name: NCCL_DEBUG
                  value: "WARN"         # INFO for verbose logs
                - name: NCCL_IB_DISABLE
                  value: "0"            # set "1" if no InfiniBand
                - name: OMP_NUM_THREADS
                  value: "4"
              resources:
                requests:
                  cpu: "4"
                  memory: "16Gi"
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "8"
                  memory: "32Gi"
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: checkpoints
                  mountPath: /checkpoints
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: resnet-data-pvc
            - name: checkpoints
              persistentVolumeClaim:
                claimName: resnet-ckpt-pvc
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi

    # ── Workers (ranks 1-3) ───────────────────────────────────────────────────
    Worker:
      replicas: 3
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: my-registry/resnet-ring-ddp:latest
              imagePullPolicy: IfNotPresent
              command:
                - torchrun
                - "--nnodes=4"
                - "--nproc_per_node=1"
                - "--rdzv_backend=c10d"
                - "--rdzv_endpoint=$(MASTER_ADDR):$(MASTER_PORT)"
                - "train.py"
                - "--arch=resnet50"
                - "--epochs=90"
                - "--batch_size=64"
                - "--lr=0.1"
                - "--data_dir=/data"
                - "--output_dir=/checkpoints"
              env:
                - name: MASTER_PORT
                  value: "20011"
                - name: NCCL_ALGO
                  value: "Ring"
                - name: NCCL_PROTO
                  value: "Simple"
                - name: NCCL_DEBUG
                  value: "WARN"
                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: OMP_NUM_THREADS
                  value: "4"
              resources:
                requests:
                  cpu: "4"
                  memory: "16Gi"
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "8"
                  memory: "32Gi"
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: checkpoints
                  mountPath: /checkpoints
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: resnet-data-pvc
            - name: checkpoints
              persistentVolumeClaim:
                claimName: resnet-ckpt-pvc
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
